services:
  postgres_db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - config/.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "airflow", "-U", "admin"]
      interval: 10s
      retries: 5
      timeout: 5s

  # airflow-init:
  #   image: apache/airflow:2.7.3-python3.10
  #   container_name: airflow-init
  #   depends_on:
  #     postgres_db:
  #       condition: service_healthy
  #   env_file:
  #     - config/.env.airflow
  #   volumes:
  #     - ../airflow/dags:/opt/airflow/dags
  #     - ../airflow/logs:/opt/airflow/logs
  #     - ../airflow/etl:/opt/airflow/etl- ../utils:/opt/airflow/utils
  #     - ../data:/opt/airflow/data
