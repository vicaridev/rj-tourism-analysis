services:
  postgres_db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - config/.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "airflow", "-U", "admin"]
      interval: 10s
      retries: 5
      timeout: 5s

  airflow-init:
    image: apache/airflow:2.10.5-python3.10
    container_name: airflow-init
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - config/.env.airflow
    environment:
      - PYTHONPATH=/opt/airflow/etl
    volumes:
      - .:/opt/airflow/app
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/etl:/opt/airflow/etl
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./db:/opt/airflow/db
      - ./services:/opt/airflow/services
      - ./utils:/opt/airflow/utils
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate && airflow users create --username admin --firstname Airflow --lastname Admin --email admin@example.com --password securepassword --role Admin && echo '✅ Airflow db and user created!'"

  airflow-webserver:
    image: custom-airflow:latest
    container_name: airflow-webserver
    build:
      context: .
      dockerfile: config/Dockerfile
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - config/.env.airflow
    environment:
      - PYTHONPATH=/opt/airflow/etl
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - ./db:/opt/airflow/db
      - ./services:/opt/airflow/services
      - ./utils:/opt/airflow/utils
      - .:/home/airflow/app  # << volume mapeado corretamente
    working_dir: /home/airflow/app
    entrypoint: /bin/bash
    command: >
      -c "pip install -e . && airflow webserver"
    ports:
      - "8080:8080"

  airflow-scheduler:
    image: custom-airflow:latest
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - config/.env.airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - ./db:/opt/airflow/db
      - ./services:/opt/airflow/services
      - ./utils:/opt/airflow/utils
      - .:/home/airflow/app
    working_dir: /home/airflow/app
    entrypoint: /bin/bash
    command: >
      -c "pip install -e . && airflow scheduler"
 

volumes:
  postgres_data: