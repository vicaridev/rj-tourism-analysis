  #     - ../services:/opt/airflow/services
  #     - ../utils:/opt/airflow/utils
  #   entrypoint: /bin/bash
  #   command: >
  #     -c "airflow db migrate && airflow users create --username admin --firstname Airflow --lastname Admin --email admin@example.com --password securepassword --role Admin && echo '✅ Airflow db and user created!'"
  airflow-webserver:
    image: custom-airflow:latest
    container_name: airflow-webserver
    build:
      context: .
      dockerfile: config/Dockerfile
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - config/.env.airflow
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs/:/opt/airflow/logs
      - ../airflow/etl:/opt/airflow/etl
      - ../data:/opt/airflow/data
      - ../db:/opt/airflow/db
      - ../services:/opt/airflow/services
      - ../utils:/opt/airflow/utils
    entrypoint: /bin/bash
    command: > 
      -c "airflow webserver"    
    ports:
      - "8080:8080"

  airflow-scheduler:
    image: custom-airflow:latest
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - config/.env.airflow
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs/:/opt/airflow/logs
      - ../airflow/etl:/opt/airflow/etl
      - ../data:/opt/airflow/data
      - ../db:/opt/airflow/db
      - ../utils:/opt/airflow/utils
    entrypoint: /bin/bash
    command: > 
      -c "airflow scheduler" 

volumes:
  postgres_data: